name: AAPS CI 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'nightscout/AndroidAPS'
          ref: 'v3.2.0.4'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      - run: keytool -genkeypair -v -keystore ../multipart_keystore.jks -alias androidapskey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=AndroidAPS"
      - run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: 123456
          ANDROID_KEY_ALIAS: androidapskey
          ANDROID_KEY_PASSWORD: 123456
      - uses: actions/upload-artifact@v4
        with:
          name: AAPS-Ready-APK
          path: app/build/outputs/apk/release/*.apk
