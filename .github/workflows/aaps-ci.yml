name: AAPS CI
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.KEYSTORE }}" | base64 -d > multipart_keystore.jks
      - run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AAPS-Ready-APK
          path: app/build/outputs/apk/release/*.apk
