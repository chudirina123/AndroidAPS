name: AAPS CI 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'nightscout/AndroidAPS'
          ref: 'v3.2.0.4'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Keystore
        run: keytool -genkeypair -v -keystore app/multipart_keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias androidapskey -storepass 123456 -keypass 123456 -dname "CN=AndroidAPS, OU=AAPS, O=AAPS, L=Unknown, S=Unknown, C=US"

      - name: Run ./gradlew assembleRelease
        run: |
          git checkout -- .
          ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: 123456
          ANDROID_KEY_ALIAS: androidapskey
          ANDROID_KEY_PASSWORD: 123456

      - uses: actions/upload-artifact@v4
        with:
          name: AAPS-Ready-APK
          path: app/build/outputs/apk/**/*.apk
